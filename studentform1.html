<html>
<head> <h2>Student form</h2> </head>
<body> 
<form>
   <table border="0">
       <tr> 
		   <td><label>Student Name</label></td>
			<td><input type="text" placeholder="Enter your name"></td>
		</tr>
   <tr> 
        <td><label>Age</label></td>
        <td><input type="number" placeholder="Enter your age"><br></td>
	</tr>	
    <tr> 
        <td><label>Gender</label></td>
		
       <td> <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br></td>
    </tr>
	<tr>
       <td> <label>Course</label></td>
        <td><select>
            <option>Select Course</option>
            <option>Java</option>
            <option>Python</option>
            <option>Web Development</option>
        </select><br></td>
    </tr>
	
    <tr>
        <td><label>Address</label></td>
        <td>   <textarea placeholder="Enter your address"></textarea><br></td>
	</tr>
	
	<tr>
		<td><label for="email">Enter your email:</label></td>
		<td><input type="email" id="email" name="email"><br></td>
    </tr>

    <tr>
		<td><label for="pwd">Password:</label></td>
		<td><input type="password" id="pwd" name="pwd"></td>
	</tr>

    <tr>	
		<td><label for="phone">Enter your phone number:</label></td>
		<td><input type="tel " id="phone" name="phone"></td>
	</tr>

	<tr>
		<td><label for="joining month">joining month:</label></td>
		<td><input type="month" id="joining month " name="joining month"><br></td>
		
	</tr>

    <tr>	
		<td><label for="appt">preferred ciass time:</label></td>
		<td><input type="time" id="appt" name="appt"></td>
	</tr>	

	<tr>
		<td><label for="datemin">your birthday:</label></td>
		<td><input type="date" id="datemin" name="datemin" ></td>
	</tr>

	<tr>
		<td><label for="vol">skill level:</label><br></td>
		<td><input type="range" id="vol" name="vol" min="0" max="50"></td>
    </tr> 
    
    <tr>
		<td><label for="favcolor">Select your favorite color:</label></td>
	    <td><input type="color" id="favcolor" name="favcolor" value="#ff0000"></td>  
	</tr>	

    <tr>
		<td><p>Choose your favorite subject:</p></td>
		<td><input type="checkbox" id="tamil" name="fav_language" value="tamil">
        <label for="tamil">tamil</label>
	    <input type="checkbox" id="maths" name="fav_language" value="maths">
   	    <label for=	"maths">maths</label><br>
	    <input type="checkbox" id="scince" name="fav_language" value="scince">
   	    <label for="scince">scince</label><br></td>
    </tr>
	
	<tr> 
        <td> <label>city</label></td>	
        <td><select>
         <option>kilinochchi</option>
         <option>jaffna</option>
        </select></td>
	</tr>

	<tr>
	   <td><label for="week">freferred week:</label></td>
     <td> <input type="week" id="week" name="week"></td>
    </tr> 

    <tr>
        <td><button colspan="2" type="submit">Submit</button></td>
		</tr>
</table>
    </form>
	  
</body>
</html>
