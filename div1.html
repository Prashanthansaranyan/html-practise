<html>
<head>
<link rel="stylesheet" href="mystyle1.css">
<style>
div.pen{
  position: sticky;
  top:0;
  padding: 5px;
  background-color: #cae8ca;
  border: 2px solid #4CAF50;
}	
}
 div.box {
  position: relative;
  left: 30px;
  right: 50px;
  bottom:80px;	
  top: 50px;
  border: 3px solid #73AD21;
}
div.book {
  position: fixed;
  bottom: 2px;
  right: 2px;
  width: 300px;
  height: 200px;
  border: 4px solid #73AD21;
}

 div.car {
  position: absolute;
  top: 80px;
  right: 0;
  width: 200px;
  height: 100px;
  border: 3px solid red;
}
</style>
</head>
<body>
			<div class="pen">pen</div>

			<div class="box">box</div>
			<div class="book">book</div>
			<div class="car">car</div>
</body>
</html>
