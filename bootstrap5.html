<html>
<head>
    
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

	</head>

<body  style=" background-color:#EAEFEF;">
	<div class="container mt-5 d-flex justify-content-center" style="width:50rem;">
  <div class="card shadow" style=" background-color:#F9F6F3;">

    <div class="card-header text-center bg-dark text-white">
      <h2 class="card-text">STUDENT INFO</h2>
    </div>
	
	
	<div class="card-body">
      <form>
		<div class="row g-3">

          <div class="col-md-6">
		  <label>Father Name</label>
            <input type="text" class="form-control" placeholder="Father Name">
          </div>
		  <div class="col-md-6">
		  <label>your Name</label>
            <input type="text" class="form-control" placeholder="Student Name">
          </div>
		  <div class="col-md-6">
		  <label>Id Number</label>
            <input type="number" class="form-control" placeholder="ID Number">
          </div>
		  <div class="col-md-6">
		  <label>NIC Number</label>
			<input type="text" class="form-control" placeholder="NIC Number">
          </div>
		  <div class="col-md-6">
            <select class="form-select">
              <option selected>Select Grade</option>
              <option>Grade 9</option>
              <option>Grade 10</option>
              <option>Grade 11</option>
            </select>
          </div>
		  <div class="col-md-6">
            <input type="date" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male">
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female">
              <label class="form-check-label" for="female">Female</label>
            </div>
			</div>

          <div class="col-md-6">
            <input type="number" class="form-control" placeholder="Phone Number">
          </div>

          <div class="col-12">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" placeholder="1234 Main St">
          </div>

          <div class="col-12">
            <label class="form-label d-block">Subjects</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="java">
              <label class="form-check-label" for="java">Java</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="css">
              <label class="form-check-label" for="css">CSS</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="html">
              <label class="form-check-label" for="html">HTML</label>
            </div>
			            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="cplus">
              <label class="form-check-label" for="cplus">C++</label>
            </div>
          </div>
		  <div class="col-12 text-center mt-2">
		<input class="btn btn-primary" type="reset" value="Reset">
          <a href="file:///C:/Yarlithtml/html-practise/studentsinfo.html"><input class="btn btn-danger"  value="Back">
		  <button type="submit" class="btn btn-primary">Submit</button>
		  </div>
		  </div>
      </form>
    </div>
	 </div>
</div>
