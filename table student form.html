
<html>
<head>

    <title>Student Form</title>
</head>

<body>
    <h2>Student Form</h2>

    <form>
        <table width="100%" cellpadding="5" >

            <tr>
                <td>Student Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td>Age</td>
                <td><input type="number" placeholder="Enter your age"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Course</td>
                <td>
                    <select>
                        <option>Select Course</option>
                        <option>Java</option>
                        <option>Python</option>
                        <option>Web Development</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td><textarea placeholder="Enter your address"></textarea></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td>Phone Number</td>
                <td><input type="tel"></td>
            </tr>

            <tr>
                <td>Joining Month</td>
                <td><input type="month"></td>
            </tr>

            <tr>
                <td>Preferred Class Time</td>
                <td><input type="time"></td>
            </tr>

            <tr>
                <td>Birthday</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Skill Level</td>
                <td><input type="range" min="0" max="50"></td>
            </tr>

            <tr>
                <td>Favorite Color</td>
                <td><input type="color"></td>
            </tr>

            <tr>
                <td>Favorite Subjects</td>
                <td>
                    <input type="checkbox"> Tamil
                    <input type="checkbox"> Maths
                    <input type="checkbox"> Science
                </td>
            </tr>

            <tr>
                <td>City</td>
                <td>
                    <select>
                        <option>Kilinochchi</option>
                        <option>Jaffna</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Preferred Week</td>
                <td><input type="week"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Submit</button>
                </td>
            </tr>

        </table>
    </form>
</body>
</html>
